# Production stack for mahalinkam.
#
# First boot:
#   cp .env.production.example .env
#   Edit .env: APP_URL=https://your.domain (APP_ENV=production / APP_DEBUG=false
#   are already set by the production template)
#   Set a PERSISTENT APP_KEY (generate once):
#     docker compose -f compose.prod.yaml run --rm app php artisan key:generate --show
#     ...and paste it into .env as APP_KEY=base64:...
#   Postgres: uncomment the `db` service and its DB_* lines below.
# Put your own reverse proxy in front of port 8080 (this stack has none).
#
# NO bundled edge reverse proxy: the operator runs their own proxy (TLS
# termination, routing) in front and points it at the single published
# HTTP port below. The `app` container's internal FPM + nginx is the
# application server, not an edge proxy.
#
# Dev continues to use the Sail `compose.yaml` — this file is separate.

services:
  app:
    build: .
    image: mahalinkam:latest
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - mahalinkam-storage:/var/www/html/storage
      # Persists the SQLite database (default DB_CONNECTION=sqlite at
      # /var/www/html/database/database.sqlite). Harmless when using Postgres.
      - mahalinkam-database:/var/www/html/database
    restart: unless-stopped
    # depends_on:
    #   - db

  worker:
    build: .
    image: mahalinkam:latest
    # Explicit entrypoint: the worker must NEVER run migrations / cache builds
    # (that is the `app` container's job — running both concurrently on a cold
    # first boot races on the fresh SQLite file). This bypasses entrypoint.sh.
    entrypoint: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
    # The base image's HEALTHCHECK curls the web server on :8080, which this
    # container doesn't run — disable it so the worker isn't perpetually "unhealthy".
    healthcheck:
      disable: true
    env_file:
      - path: .env
        required: false
    volumes:
      - mahalinkam-storage:/var/www/html/storage
      - mahalinkam-database:/var/www/html/database
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # Optional Postgres. SQLite works with no extra service, so this is
  # commented out by default. To use Postgres: uncomment this block, the
  # `depends_on: [db]` above, and set these in your `.env`:
  #
  #   DB_CONNECTION=pgsql
  #   DB_HOST=db
  #   DB_PORT=5432
  #   DB_DATABASE=mahalinkam
  #   DB_USERNAME=mahalinkam
  #   DB_PASSWORD=change-me
  # ---------------------------------------------------------------------
  # db:
  #   image: postgres:16
  #   environment:
  #     POSTGRES_DB: mahalinkam
  #     POSTGRES_USER: mahalinkam
  #     POSTGRES_PASSWORD: change-me
  #   volumes:
  #     - mahalinkam-pgdata:/var/lib/postgresql/data
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "pg_isready", "-U", "mahalinkam", "-d", "mahalinkam"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

volumes:
  mahalinkam-storage:
  mahalinkam-database:
  # mahalinkam-pgdata:
