# .github/workflows/ci.yml
name: CI
on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql, pgsql]
    services:
      mysql:
        image: mysql:8
        env: { MYSQL_DATABASE: mahalinkam, MYSQL_ROOT_PASSWORD: root }
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: mahalinkam, POSTGRES_PASSWORD: root }
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', tools: composer }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci && npm run build
      - run: cp .env.example .env && php artisan key:generate
      - run: composer lint
      # DB config is passed as real process env vars on the test steps below,
      # not appended to .env. PHPUnit's non-`force` <env> entries in phpunit.xml
      # (DB_CONNECTION=sqlite, DB_DATABASE=:memory:) do NOT overwrite a variable
      # that already exists in the process environment, so these win and the
      # mysql/pgsql legs genuinely run against those engines.
      - name: Run tests (sqlite)
        if: matrix.db == 'sqlite'
        run: |
          php artisan tinker --execute="echo 'DB default: '.config('database.default').PHP_EOL;"
          php artisan test
      - name: Run tests (mysql)
        if: matrix.db == 'mysql'
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: mahalinkam
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan tinker --execute="echo 'DB default: '.config('database.default').PHP_EOL;"
          php artisan test
      - name: Run tests (pgsql)
        if: matrix.db == 'pgsql'
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: mahalinkam
          DB_USERNAME: postgres
          DB_PASSWORD: root
        run: |
          php artisan tinker --execute="echo 'DB default: '.config('database.default').PHP_EOL;"
          php artisan test

  # Cut a GitHub Release when a v*.*.* tag is pushed and the full 3-DB test
  # matrix passed. The body is the matching section of CHANGELOG.md, with
  # GitHub's auto-generated commit/contributor notes appended below it. The
  # server ships as source + compose, so there are no build artifacts to attach.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog section for this tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]"    { found=1; next }
            found && /^## \[/          { exit }
            found && /^\[[^]]+\]: /    { exit }
            found                     { print }
          ' CHANGELOG.md | sed -e '1{/^$/d}' -e '${/^$/d}' > release-body.md
          if [ ! -s release-body.md ]; then
            echo "Release $version. See CHANGELOG.md for details." > release-body.md
          fi
          echo "----- release body -----"
          cat release-body.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          generate_release_notes: true
